<!-- Catppuccin palette variables (all flavors) -->
<link rel="stylesheet" href="themes/catppuccin-palette.css">
<!-- Base styles intentionally minimal to avoid interfering with hljs theme -->
<style>
  :root { color-scheme: dark; }
  /* Choose your flavor here by using the corresponding variables */
  html, body { margin:0; padding:0; background: var(--ctp-macchiato-base, #24273a); color: var(--ctp-macchiato-text, #cad3f5); font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif; }
  a { color: var(--ctp-macchiato-blue, #8aadf4); }
  .site-header { background: var(--ctp-macchiato-mantle, #1e2030); border-bottom: 1px solid var(--ctp-macchiato-surface1, #494d64); padding: 10px 16px; position: sticky; top: 0; }
  .site-header a { color: var(--ctp-macchiato-blue, #8aadf4); text-decoration: none; margin-right: 12px; }
  /* Constrain page width and add comfortable margins */
  #header, #content, #footer { max-width: 900px; margin: 0 auto; padding: 0 20px; }
  #content { padding-top: 24px; padding-bottom: 48px; }
  /* Profile card (avatar + meta) for About page */
  .profile-card {
    float: left;
    width: 220px;
    margin: 0 20px 12px 0;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--ctp-macchiato-surface1, #494d64);
    background: var(--ctp-macchiato-mantle, #1e2030);
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    box-sizing: border-box; /* include padding/border in width */
  }
  .profile-card .imageblock img {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 8px;
    border: 2px solid var(--ctp-macchiato-surface1, #494d64);
    box-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .profile-card .profile-meta { font-size: 0.95rem; line-height: 1.35; color: var(--ctp-macchiato-subtext1, #a5adcb); }
  .profile-card .profile-meta ul { list-style: none; padding: 0; margin: 8px 0 0 0; }
  .profile-card .profile-meta li { margin: 4px 0; }
  .profile-card .profile-meta a { color: var(--ctp-macchiato-blue, #8aadf4); text-decoration: none; }
  .profile-card .profile-meta a:hover { text-decoration: underline; }
  .profile-card .profile-meta .icon { width: 1.1em; height: 1.1em; vertical-align: -0.15em; margin-right: 6px; opacity: 0.95; }
  .profile-card .profile-meta .profile-name { text-align: center; font-weight: 700; font-size: 1.05rem; color: var(--ctp-macchiato-text, #cad3f5); }
  @media (max-width: 600px) {
    .profile-card { float: none; width: auto; margin: 0 0 16px 0; }
    .profile-card .imageblock img { margin: 0 auto 8px; }
    .profile-card .profile-meta { text-align: center; }
  }

  /* Avoid horizontal scrolling: wrap long words/links and constrain media */
  #content { overflow-wrap: anywhere; }
  #content .paragraph p, #content .sectionbody { overflow-wrap: anywhere; word-break: break-word; }
  #content img, #content video, #content svg { max-width: 100%; height: auto; }

  /* Home feed cards */
  .card {
    border: 1px solid var(--ctp-macchiato-surface1, #494d64);
    background: var(--ctp-macchiato-mantle, #1e2030);
    border-radius: 12px;
    padding: 16px;
    margin: 14px 0;
    box-shadow: 0 2px 6px rgba(0,0,0,.18);
  }
  .card-title { font-weight: 700; font-size: 1.2rem; }
  .card-title a { color: var(--ctp-macchiato-blue, #8aadf4); text-decoration: none; }
  .card-title a:hover { text-decoration: underline; }
  .card-meta { color: var(--ctp-macchiato-subtext1, #a5adcb); font-size: 0.9rem; margin-bottom: 8px; }
  .card .excerpt { margin-bottom: 8px; }
  .card .excerpt p {
    display: -webkit-box;
    -webkit-line-clamp: 5; /* number of lines to show */
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Mini about block on home */
  .mini-about { border: 1px solid var(--ctp-macchiato-surface1, #494d64); background: var(--ctp-macchiato-mantle, #1e2030); border-radius: 12px; padding: 14px; margin: 8px 0 8px; }
  .mini-about > .content { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .mini-about .imageblock img { width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--ctp-macchiato-surface1, #494d64); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .mini-about .ulist.mini-list ul { list-style: none; margin: 0; padding: 0; }
  .mini-about .ulist.mini-list li { margin: 2px 0; }
  .mini-about .ulist.mini-list a { color: var(--ctp-macchiato-blue, #8aadf4); text-decoration: none; }
  .mini-about .ulist.mini-list a:hover { text-decoration: underline; }
</style>
